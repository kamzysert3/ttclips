[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttclips"
version = "1.1.0"
description = "Fully local clip reposter: YouTube highlight clips + generated shorts, auto-posted to TikTok and YouTube Shorts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tiktok", "youtube", "shorts", "clips", "automation", "yt-dlp", "whisper", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0.0",
    "google-genai>=1.0.0",
    "edge-tts>=6.1.10",
    "tiktok-uploader>=1.2.0",
    "playwright>=1.58.0",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
api = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
dev = ["build>=1.2", "twine>=5.0", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
ttclips = "ttclips.scheduler:main"
ttclips-init = "ttclips.scaffold:main"
ttclips-gemini = "ttclips.gemini:main"
ttclips-upload = "ttclips.uploader:main"
ttclips-youtube = "ttclips.youtube_uploader:main"

[tool.setuptools.packages.find]
include = ["ttclips*"]

[tool.setuptools.package-data]
ttclips = ["templates/*"]
