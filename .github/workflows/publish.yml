name: Publish to PyPI

# Releases are triggered by pushing a version tag (e.g. `v0.1.0`). The tag is
# the source of truth: the build only proceeds when it matches the version
# declared in pyproject.toml and ttclips/__init__.py.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # manual trigger for debugging

permissions:
  contents: read
  # Trusted publishing (OIDC): required so PyPI can verify this specific
  # GitHub repo + workflow without any stored token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches declared version
        run: python .github/scripts/check_release.py "$GITHUB_REF_NAME"

      - name: Build wheel + sdist
        run: python -m build

      - name: Twine check the artifacts
        run: twine check dist/*

      # Pushes without an explicit password/token -> uses trusted publishing
      # (OIDC) via the id-token permission above.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1