name: CI

# Validation on every push/PR: builds the package, runs twine check and a
# quick import smoke test. No secrets required.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine httpx

      - name: Build wheel + sdist
        run: python -m build

      - name: Twine check the artifacts
        run: twine check dist/*

      - name: Import + CLI smoke test
        run: python -m ttclips --version